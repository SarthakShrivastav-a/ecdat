  family: AES
  primitive: block-cipher
  confidentiality: true
  key_size: 128
  oid: 2.16.840.1.101.3.4.1.6
  quantum: weakened
  quantum_reason: "Grover reduces AES-128 to ~64-bit effective security; still NIST-approved but fails CNSA 2.0"
  classical_security_bits: 128
  nist_quantum_level: 1
  replace: {block-cipher: AES-256}
  functions: [keygen, encrypt, decrypt]

