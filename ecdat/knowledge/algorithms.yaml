# ECDAT algorithm knowledge base. One entry per canonical algorithm.
#   family:   CycloneDX 1.7 Cryptography Registry family name (cryptography-defs.json)
#   primitive: CycloneDX cryptoProperties.algorithmProperties.primitive enum
#   quantum:  broken (Shor) | weakened (Grover) | legacy-broken (classically broken already) | safe
#   classical_security_bits: int, or map keyed by key size
#   nist_quantum_level: NIST PQC security category (0 for classically-only algorithms)
#   replace: default PQC / hygiene replacement by function
#   confidentiality: true if the primitive protects confidentiality (HNDL applies)

RSA:
  aliases: [rsa, rsaencryption, rsa-oaep, rsaes-oaep, rsa-pkcs1, rsaes-pkcs1, rsassa-pkcs1, rsassa-pss, rsa-pss,
            sha1withrsaencryption, sha256withrsaencryption, sha384withrsaencryption, sha512withrsaencryption,
            sha256withrsa, sha384withrsa, sha512withrsa, sha1withrsa, md5withrsa, rsa-2048, rsa-3072, rsa-4096,
            rsa-1024, rsa2048, rsa4096, rsa1024, rsa_pkcs1_padding, rsa_oaep, rsaprivatekey, rsapublickey, id-rsa]
  family: RSASSA-PKCS1
  primitive: pke
  confidentiality: true
  oid: 1.2.840.113549.1.1.1
  quantum: broken
  quantum_reason: "Integer factorisation is broken by Shor's algorithm"
  classical_security_bits: {1024: 80, 2048: 112, 3072: 128, 4096: 152, 7680: 192, 15360: 256}
  nist_quantum_level: 0
  legacy_min_key_size: 2048
  replace: {kem: X25519MLKEM768, pke: ML-KEM-768, signature: ML-DSA-65}
  functions: [keygen, encrypt, decrypt, sign, verify]
  cert_in_example: "RSA-2048 / sha256WithRSAEncryption"

