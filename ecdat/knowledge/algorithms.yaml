            p-256, p-384, p-521, p256, p384, p521, nistp256, nistp384, nistp521, secp256k1, brainpoolp256r1]
  family: ECDSA
  primitive: signature
  confidentiality: false
  oid: 1.2.840.10045.4.3.2
  quantum: broken
  quantum_reason: "Elliptic-curve discrete log is broken by Shor's algorithm"
  classical_security_bits: {256: 128, 384: 192, 521: 256, 224: 112}
  nist_quantum_level: 0
  replace: {signature: ML-DSA-65}
  functions: [keygen, sign, verify]

