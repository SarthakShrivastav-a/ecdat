  rustls: {provides: [TLS, ECDH, X25519, AES-128, AES-256, ChaCha20], pqc_native: false}
  openssl: {provides: [RSA, ECDSA, ECDH, DH, DSA, AES-128, AES-256, 3DES, DES, RC4, MD5, SHA-1, SHA-256, SHA-512, HMAC, TLS], pqc_native: false}
  rsa: {provides: [RSA], pqc_native: false}
  ed25519-dalek: {provides: [Ed25519], pqc_native: false}
  x25519-dalek: {provides: [X25519], pqc_native: false}
