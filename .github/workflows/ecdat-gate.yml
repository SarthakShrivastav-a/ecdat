# Template CI gate for projects that adopt ECDAT.
# ecdat.yaml (what to scan) and cbom-baseline.json (the accepted CBOM to diff against) belong to the
# adopting project's repo root; they are not part of ECDAT itself. If cbom-baseline.json is absent, this
# run's own scan is used as the baseline (the gate passes) - commit out/base/cbom.json as cbom-baseline.json
# to start enforcing. Outside the ECDAT repo, replace `pip install . --no-deps` with
# `pip install --no-deps git+https://github.com/SarthakShrivastav-a/ecdat.git` and copy requirements-ci.txt.
name: ECDAT quantum-crypto gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  cbom-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install ECDAT
        run: |
          pip install . --no-deps
          pip install -r requirements-ci.txt
          pip install --no-deps pyjks   # its twofish dependency needs a C compiler and is not used
      - name: Scan and gate (no external engines needed)
        run: |
          BASELINE=cbom-baseline.json
          if [ ! -f "$BASELINE" ]; then
            echo "::warning::cbom-baseline.json not found; using this run's scan as the baseline. Commit out/base/cbom.json as cbom-baseline.json to enforce the gate."
            ecdat scan -c ecdat.yaml -o out/base --no-sign --no-external-tools
            BASELINE=out/base/cbom.json
          fi
          ecdat gate -c ecdat.yaml --baseline "$BASELINE" --policy no-new-vulnerable --no-external-tools -o out/gate
      - name: Upload CBOM, VEX, SARIF and gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecdat-cbom
          path: |
            out/gate/cbom.json
            out/gate/vex.json
            out/gate/findings.sarif
            out/gate/gate.md
      - name: Publish findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/gate/findings.sarif
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: out/gate/gate.md
