# Which packages implement which algorithms (CycloneDX `provides` edges), per ecosystem.
# pqc_native: the package ships NIST PQC (FIPS 203/204) itself; pqc_native_from: version that first did.
pypi:
  cryptography: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, DH, DSA, AES-128, AES-256, ChaCha20, 3DES, SHA-1, SHA-256, SHA-384, SHA-512, SHA3-256, MD5, HMAC, PBKDF2, scrypt, HKDF], pqc_native: false}
  pycryptodome: {provides: [RSA, ECDSA, DSA, AES-128, AES-256, ChaCha20, 3DES, DES, RC4, Blowfish, MD5, SHA-1, SHA-256, SHA-512, SHA3-256, HMAC, PBKDF2, scrypt], pqc_native: false}
  pycryptodomex: {provides: [RSA, ECDSA, DSA, AES-128, AES-256, ChaCha20, 3DES, DES, RC4, Blowfish, MD5, SHA-1, SHA-256, SHA-512, HMAC, PBKDF2], pqc_native: false}
  pynacl: {provides: [X25519, Ed25519, ChaCha20, Argon2, SHA-256, SHA-512], pqc_native: false}
  pyjwt: {provides: [HMAC, RSA, ECDSA, Ed25519], pqc_native: false, wrapper: true}
  python-jose: {provides: [HMAC, RSA, ECDSA], pqc_native: false, wrapper: true}
  authlib: {provides: [HMAC, RSA, ECDSA], pqc_native: false, wrapper: true}
  paramiko: {provides: [RSA, ECDSA, Ed25519, DH, ECDH, AES-128, AES-256, SHA-1, SHA-256], pqc_native: false}
  pyopenssl: {provides: [RSA, ECDSA, DH, AES-256, SHA-256, TLS], pqc_native: false}
  rsa: {provides: [RSA], pqc_native: false}
  ecdsa: {provides: [ECDSA], pqc_native: false}
  bcrypt: {provides: [bcrypt], pqc_native: false}
  argon2-cffi: {provides: [Argon2], pqc_native: false}
  passlib: {provides: [bcrypt, PBKDF2, scrypt, Argon2, MD5, SHA-1, SHA-256], pqc_native: false, wrapper: true}
  kyber-py: {provides: [ML-KEM-512, ML-KEM-768, ML-KEM-1024], pqc_native: true}
  dilithium-py: {provides: [ML-DSA-44, ML-DSA-65, ML-DSA-87], pqc_native: true}
  liboqs-python: {provides: [ML-KEM-768, ML-KEM-1024, ML-DSA-65, ML-DSA-87, SLH-DSA, FN-DSA, HQC], pqc_native: true}
  pqcrypto: {provides: [ML-KEM-768, ML-DSA-65, SLH-DSA], pqc_native: true}
  hashlib: {provides: [MD5, SHA-1, SHA-256, SHA-384, SHA-512, SHA3-256, PBKDF2], stdlib: true}
  ssl: {provides: [TLS], stdlib: true}
  requests: {provides: [TLS], wrapper: true}
  urllib3: {provides: [TLS], wrapper: true}
  httpx: {provides: [TLS], wrapper: true}
  boto3: {provides: [KMS], cloud: true}
  google-cloud-kms: {provides: [KMS], cloud: true}
  azure-keyvault-keys: {provides: [KMS], cloud: true}
  hvac: {provides: [KMS], cloud: true}
  python-pkcs11: {provides: [HSM], hardware: true}
  pkcs11: {provides: [HSM], hardware: true}

npm:
  node-forge: {provides: [RSA, AES-128, AES-256, 3DES, DES, RC4, MD5, SHA-1, SHA-256, SHA-384, SHA-512, HMAC, PBKDF2, TLS], pqc_native: false}
  crypto-js: {provides: [AES-128, AES-256, 3DES, DES, RC4, MD5, SHA-1, SHA-256, SHA-512, SHA3-256, HMAC, PBKDF2], pqc_native: false}
  jsonwebtoken: {provides: [HMAC, RSA, ECDSA], pqc_native: false, wrapper: true}
  jose: {provides: [HMAC, RSA, ECDSA, Ed25519, ECDH, AES-128, AES-256], pqc_native: false, wrapper: true}
  bcrypt: {provides: [bcrypt], pqc_native: false}
  bcryptjs: {provides: [bcrypt], pqc_native: false}
  argon2: {provides: [Argon2], pqc_native: false}
  tweetnacl: {provides: [X25519, Ed25519, SHA-512], pqc_native: false}
  "@noble/curves": {provides: [ECDSA, ECDH, X25519, Ed25519], pqc_native: false}
  "@noble/hashes": {provides: [SHA-256, SHA-512, SHA3-256, HMAC, PBKDF2, scrypt], pqc_native: false}
  "@noble/post-quantum": {provides: [ML-KEM-768, ML-KEM-1024, ML-DSA-65, ML-DSA-87, SLH-DSA], pqc_native: true}
  liboqs-node: {provides: [ML-KEM-768, ML-DSA-65], pqc_native: true}
  ssh2: {provides: [RSA, ECDSA, Ed25519, DH, ECDH, AES-128, AES-256, SSH], pqc_native: false}
  md5: {provides: [MD5], pqc_native: false}
  sha1: {provides: [SHA-1], pqc_native: false}
  "@aws-sdk/client-kms": {provides: [KMS], cloud: true}
  aws-sdk: {provides: [KMS], cloud: true}

go:
