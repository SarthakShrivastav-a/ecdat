AES:
  aliases: [aes, rijndael, aes-cbc, aes-gcm, aes-ctr, aes-ecb, aescbc, aesgcm, id-aes]
  family: AES
  primitive: block-cipher
  confidentiality: true
  sized_variants: {"128": AES-128, "192": AES-192, "256": AES-256}
  quantum: weakened
  quantum_reason: "Grover's algorithm halves the effective key length; key size not yet known"
  nist_quantum_level: 1
  replace: {block-cipher: AES-256}
  functions: [keygen, encrypt, decrypt]

AES-128:
  aliases: [aes-128, aes128, aes-128-gcm, aes-128-cbc, aes-128-ctr, aes-128-ecb, aes-128-ccm, aes128-gcm, aes128-cbc,
