# truth: TLS protocol config TLSv1.2+TLSv1.3, ECDHE-RSA-AES256-GCM-SHA384 + ECDHE-ECDSA-CHACHA20-POLY1305, curve prime256v1
server {
    listen 443 ssl;
    server_name pay.zoo.local;
    ssl_certificate     /etc/ssl/certs/pay.crt;
    ssl_certificate_key /etc/ssl/private/pay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve prime256v1;
    ssl_prefer_server_ciphers on;
}
