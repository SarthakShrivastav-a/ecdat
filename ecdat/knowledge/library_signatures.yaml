  github.com/cloudflare/circl: {provides: [ML-KEM-768, ML-KEM-1024, ML-DSA-65, X25519, Ed25519, SLH-DSA], pqc_native: true}
  github.com/open-quantum-safe/liboqs-go: {provides: [ML-KEM-768, ML-DSA-65, FN-DSA, HQC], pqc_native: true}
  github.com/golang-jwt/jwt: {provides: [HMAC, RSA, ECDSA, Ed25519], wrapper: true}
  github.com/dgrijalva/jwt-go: {provides: [HMAC, RSA, ECDSA], wrapper: true}
  github.com/aws/aws-sdk-go: {provides: [KMS], cloud: true}
  github.com/miekg/pkcs11: {provides: [HSM], hardware: true}
  github.com/ThalesIgnite/crypto11: {provides: [HSM], hardware: true}

