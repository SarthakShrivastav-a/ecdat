  org.bouncycastle:bcprov-jdk15on: {provides: [RSA, ECDSA, ECDH, DH, DSA, AES-128, AES-256, 3DES, DES, RC4, Blowfish, MD5, SHA-1, SHA-256, SHA-512, HMAC, PBKDF2], pqc_native: false}
