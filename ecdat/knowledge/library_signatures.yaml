composer:
  phpseclib/phpseclib: {provides: [RSA, ECDSA, DH, AES-128, AES-256, 3DES, DES, RC4, Blowfish, MD5, SHA-1, SHA-256, SSH], pqc_native: false}
  firebase/php-jwt: {provides: [HMAC, RSA, ECDSA], wrapper: true}
  paragonie/sodium_compat: {provides: [X25519, Ed25519, ChaCha20, Argon2], pqc_native: false}

# Binary / system libraries recognised by version strings (binary collector)
system:
  openssl: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, DH, DSA, AES-128, AES-256, ChaCha20, 3DES, DES, RC4, MD5, SHA-1, SHA-256, SHA-384, SHA-512, SHA3-256, HMAC, PBKDF2, TLS], pqc_native_from: "3.5.0"}
  mbedtls: {provides: [RSA, ECDSA, ECDH, X25519, DH, AES-128, AES-256, ChaCha20, 3DES, MD5, SHA-1, SHA-256, SHA-512, HMAC, TLS], pqc_native: false}
  wolfssl: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, AES-128, AES-256, ChaCha20, 3DES, MD5, SHA-1, SHA-256, SHA-512, HMAC, TLS, ML-KEM-768, ML-DSA-65], pqc_native_from: "5.7.0"}
  libsodium: {provides: [X25519, Ed25519, ChaCha20, Argon2, SHA-256, SHA-512], pqc_native: false}
  gnutls: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, DH, AES-128, AES-256, ChaCha20, SHA-256, TLS], pqc_native_from: "3.8.9"}
  boringssl: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, AES-128, AES-256, ChaCha20, SHA-256, TLS, X25519MLKEM768], pqc_native: true}
  libressl: {provides: [RSA, ECDSA, ECDH, X25519, Ed25519, DH, AES-128, AES-256, ChaCha20, 3DES, MD5, SHA-1, SHA-256, TLS], pqc_native: false}
  liboqs: {provides: [ML-KEM-512, ML-KEM-768, ML-KEM-1024, ML-DSA-44, ML-DSA-65, ML-DSA-87, SLH-DSA, FN-DSA, HQC], pqc_native: true}

# Language runtimes: does the runtime itself ship NIST PQC? Drives the agility "runtime_pqc" dimension.
runtimes:
  go: {pqc_native_from: "1.24", note: "crypto/mlkem (ML-KEM-768/1024) since Go 1.24; X25519MLKEM768 default in crypto/tls; ML-DSA in Go 1.27"}
  java: {pqc_native_from: "24", note: "JEP 496 (ML-KEM) and JEP 497 (ML-DSA) in JDK 24"}
  openssl: {pqc_native_from: "3.5.0", note: "OpenSSL 3.5 ships ML-KEM, ML-DSA, SLH-DSA and X25519MLKEM768"}
  python: {pqc_native: false, note: "no PQC in the stdlib; use kyber-py / dilithium-py / liboqs-python"}
  node: {pqc_native: false, note: "no PQC in node:crypto yet; use @noble/post-quantum or liboqs-node"}
  dotnet: {pqc_native_from: "10.0", note: ".NET 10 adds ML-KEM / ML-DSA on supported platforms"}
  c: {pqc_native: false, note: "link liboqs / oqs-provider or upgrade OpenSSL to 3.5+"}
