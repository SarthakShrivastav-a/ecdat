  commons-codec:commons-codec: {provides: [MD5, SHA-1, SHA-256, SHA-512, HMAC], pqc_native: false}
  org.apache.sshd:sshd-core: {provides: [RSA, ECDSA, Ed25519, DH, ECDH, AES-128, AES-256, SSH], pqc_native: false}
  com.jcraft:jsch: {provides: [RSA, DSA, ECDSA, DH, ECDH, AES-128, AES-256, 3DES, SHA-1, SHA-256, SSH], pqc_native: false}
